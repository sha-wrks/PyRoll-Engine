[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pyroll-engine"
version = "1.1.0"
description = "A lightweight desktop payroll management system"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["payroll", "hr", "desktop", "tkinter"]
dependencies = [
    "redis>=5.0.0",
]

[project.urls]
Repository = "https://github.com/sha-wrks/PyRoll-Engine"
"Bug Tracker" = "https://github.com/sha-wrks/PyRoll-Engine/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
